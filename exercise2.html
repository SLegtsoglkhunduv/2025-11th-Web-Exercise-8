<!doctype html>
<html>
  <head>
    <style>
      #container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 25px;
        margin-left: 15px;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: #e67e78;
        color: white;
        font-size: 26px;
        font-weight: bold;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <button onclick="addBox()">Add Box</button>
    <div id="container"></div>

    <script>
      let count = 1;

      function addBox() {
        let box = document.createElement("div");
        box.className = "box";
        box.innerText = count;
        count++;
        document.getElementById("container").appendChild(box);
      }
    </script>
  </body>
</html>
