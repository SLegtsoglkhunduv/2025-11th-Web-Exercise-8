<!doctype html>
<html>
  <head>
    <style>
      #container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 10px;
      }
      .box {
        width: 120px;
        height: 120px;
        background-color: lightcoral;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button onclick="addBox()">Add Box</button>
    <div id="container"></div>

    <script>
      function addBox() {
        const box = document.createElement("div");
        box.className = "box";
        box.innerText = "Click to remove";
        box.onclick = function () {
          box.remove();
        };
        document.getElementById("container").appendChild(box);
      }
    </script>
  </body>
</html>
